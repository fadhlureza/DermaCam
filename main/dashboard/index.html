<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaCam | Diagnostic Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="tf.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <h1>DermaCam</h1>
            </div>
            
            <div class="nav-section">
                <p class="nav-label">SYSTEM STATUS</p>
                <div class="status-item connected">
                    <span class="indicator"></span>
                    <span>Device Connected</span>
                </div>
                <div id="ai-status" class="status-item loading">
                    <span class="indicator"></span>
                    <span>Loading AI Engine...</span>
                </div>
            </div>

            <div class="nav-section">
                <p class="nav-label">CONTROLS</p>
                <button id="toggle-light-btn" class="btn-toggle active">
                    <span class="icon">💡</span> 
                    <span id="btn-text">Turn Off Ring Light</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <h2>Burn Diagnostic Dashboard</h2>
                <span class="date-display" id="date-display">Today</span>
            </header>

            <div class="dashboard-grid">
                <!-- Camera Feed -->
                <div class="card video-card">
                    <div class="card-header">
                        <h3>Live Camera Feed</h3>
                        <span id="stream-badge" class="badge live">LIVE</span>
                    </div>
                    <div class="video-wrapper">
                        <img id="camera-stream" src="http://192.168.4.1:81/stream" crossorigin="anonymous" alt="Camera Feed">
                        <!-- Crosshair overlay for professional look -->
                        <div class="crosshair"></div>
                    </div>
                    <div class="video-actions">
                        <button id="capture-btn" class="btn-capture">
                            <span class="icon">📸</span>
                            <span id="capture-btn-text">Capture & Diagnose</span>
                        </button>
                    </div>
                </div>

                <!-- AI Analysis Results -->
                <div class="card analysis-card">
                    <div class="card-header">
                        <h3>AI Analysis Report</h3>
                    </div>
                    
                    <div class="severity-container">
                        <p class="sub-label">PREDICTED SEVERITY</p>
                        <div class="severity-badge" id="severity-badge">
                            Awaiting Scan...
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <span class="metric-label">Confidence</span>
                            <span class="metric-value" id="confidence-val">--%</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label">Status</span>
                            <span class="metric-value" id="status-val">Standby</span>
                        </div>
                    </div>

                    <div class="recommendation-box" id="recommendation">
                        Please point the camera directly at the burn area to begin autonomous scanning.
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <canvas id="hidden-canvas" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
