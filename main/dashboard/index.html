<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derma-Cam Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Offline TensorFlow.js -->
    <script src="tf.min.js"></script>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header class="glass-panel">
            <h1>Derma-Cam</h1>
            <p>AI Burn Screening System</p>
            <div id="connection-status" class="status-indicator">
                <span class="dot"></span> Connected
            </div>
        </header>

        <main>
            <section class="camera-section glass-panel">
                <h2>Live View</h2>
                <div class="video-container">
                    <img id="camera-stream" src="/stream" crossorigin="anonymous" style="width: 100%; height: 100%; object-fit: cover;" alt="Camera Stream">
                </div>
                <div class="controls">
                    <p id="model-status" style="color: var(--warning-color); font-size: 0.9rem;">Memuat Model AI...</p>
                </div>
            </section>

            <section class="analysis-section glass-panel">
                <h2>Analisis Real-time</h2>
                <div class="result-card">
                    <div class="severity-badge" id="severity-badge">
                        Menunggu...
                    </div>
                    <div class="details">
                        <div class="detail-item">
                            <span class="label">Status:</span>
                            <span class="value" id="status-val">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Confidence:</span>
                            <span class="value" id="confidence-val">-</span>
                        </div>
                    </div>
                </div>
                <div class="action-recommendation" id="recommendation">
                    Arahkan kamera ke area luka untuk memulai pemindaian otomatis.
                </div>
            </section>
        </main>
    </div>
    
    <!-- Hidden canvas for image extraction -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>
    
    <script src="script.js"></script>
</body>
</html>
